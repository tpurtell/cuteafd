# PeerSwarm configuration for CuteAFD
# Runtime state, peer worktrees, build caches, and SQLite DB live under peerswarm.state/ (gitignored).

[project]
name = "cuteafd"
integration_branch = "dev"
state_dir = "peerswarm.state"
master = "agy"

[tmux]
layout = "windows"
session_name = "cuteafd-swarm"
remain_on_exit = true
post_start_delay_ms = 5000

[health]
nudge_cooldown_secs = 120
max_unacked_depth = 8
max_unacked_age_secs = 1800
auto_nudge_on_mail = true

[watchdog]
# Watchdog auto-recovers crashed/unexpectedly exited coordinators (e.g. Claude random full exits)
# with `--resume`, crash-loop backoff, and a recovery kickoff prompt; `peerswarm stop` sets desired_state="stopped".
auto_restart = true
max_restarts_per_window = 4
restart_window_secs = 900
base_backoff_secs = 15
ready_timeout_secs = 25

[budget]
# Moderate vendor load only when its LAST available account drops <= 20% remaining
moderate_below_pct = 20.0
conserve_below_pct = 8.0
failover_below_pct = 3.0
auto_failover = true
failover_cooldown_secs = 1800
max_concurrent_wip_per_peer = 3
max_pending_merges_before_throttle = 4

[dashboard]
# Auto-launched alongside the swarm on LAN (strictly read-only web UI + telemetry collector)
enabled = true
bind = "0.0.0.0"
port = 7788
window_name = "dashboard"
poll_interval_secs = 3
usage_probe_interval_secs = 1800
gpu_poll_interval_secs = 15

[github]
enabled = true
repo = "tpurtell/cuteafd"
issue_kinds = ["feature"]
pr_on_merge = true

[worktrees]
post_create_hook = "scripts/dev/submodule-init-local"
# Monitor legacy worktree folder in `peerswarm disk` / `peerswarm gc`
extra_roots = ["~/Developer/cute-worktrees"]

[caches]
subdir = "caches"
# Surface legacy escaping cache directories in `peerswarm disk`
extra_paths = ["~/.cache/cuteafd/builds"]

# ---------------------------------------------------------------------------
# Coordinator Peers
# ---------------------------------------------------------------------------

[peers.agy]
cli = "agy"
vendor = "google"
model = "gemini-4-neon-high"
plan_usd = 200
affinity_kinds = ["perf", "duel", "research"]
yolo = true
remote_control = true
add_dirs = [
  "/home/tj/Developer/sparkinfer-glmrt",
  "/home/tj/Developer/GPTQModel",
]
post_start_commands = []

[peers.agy.tiers]
fast = "gemini-4-hydrogen-high"
standard = "gemini-4-neon-high"
premium = "gemini-4-neon-xhigh"

[peers.claude]
cli = "claude"
vendor = "anthropic"
model = "opus"
# SIGKILL on managed restart avoids Claude's clean-exit handler marking async subagents cancelled
stop_signal = "SIGKILL"
affinity_kinds = ["feature", "bug", "task"]
yolo = true
remote_control = true
remote_control_name = "cuteafd-claude"
add_dirs = [
  "/home/tj/Developer/sparkinfer-glmrt",
  "/home/tj/Developer/GPTQModel",
]
# Native --remote-control is enabled above. If your Claude session ever needs
# slash-command activation instead, set remote_control = false and uncomment:
# post_start_commands = ["/remote-control"]
post_start_commands = []

[peers.claude.tiers]
fast = "sonnet"
standard = "opus"
premium = "fable"

# Bidirectional two-account Claude Max pool (both share ~/.claude/projects so `--resume` persists across switches).
# PeerSwarm only moderates Anthropic at <= 20% of whichever is the LAST remaining account.
[[peers.claude.accounts]]
id = "tpurtell"
plan_usd = 200
unset_env = ["CLAUDE_SECURESTORAGE_CONFIG_DIR", "CLAUDE_CONFIG_DIR", "CLAUDE_CODE_OAUTH_TOKEN", "ANTHROPIC_AUTH_TOKEN", "ANTHROPIC_API_KEY"]

[[peers.claude.accounts]]
id = "vimoin"
plan_usd = 200
unset_env = ["CLAUDE_CONFIG_DIR", "CLAUDE_CODE_OAUTH_TOKEN", "ANTHROPIC_AUTH_TOKEN", "ANTHROPIC_API_KEY"]
env = { CLAUDE_SECURESTORAGE_CONFIG_DIR = "~/.claude-vimoin" }

[peers.codex]
cli = "codex"
vendor = "openai"
model = "gpt-6.2-sol"
effort = "high"
plan_usd = 500
affinity_kinds = ["feature", "bug", "infra", "perf"]
yolo = true
add_dirs = [
  "/home/tj/Developer/sparkinfer-glmrt",
  "/home/tj/Developer/GPTQModel",
]
post_start_commands = []

[peers.codex.tiers]
fast = "gpt-6.2-sol"
standard = "gpt-6.2-sol"
premium = "gpt-6.2-astra"

# ---------------------------------------------------------------------------
# Cluster Hardware, Build Seed & CPU Slot Resources (SQLite FIFO + Backfill)
# ---------------------------------------------------------------------------

[resources]
# Canonical lock order prevents AB/BA deadlocks across serving GPUs, Sparks, seeds, and host builds.
order = ["sparks", "gpu0", "gpu1", "rhea", "moa", "kakapo", "cassowary", "maxq", "build", "cpu-gate"]
compat_env_prefix = "CUTEAFD_HW"

[resources.definitions.sparks]
capacity = 1
description = "Serving Spark pool (ostrich, dodo, emu, kiwi, plus rhea/moa when serving)"

[resources.definitions.gpu0]
capacity = 1
description = "raptor RTX PRO 6000 GPU 0"

[resources.definitions.gpu1]
capacity = 1
description = "raptor RTX PRO 6000 GPU 1"

[resources.definitions.rhea]
capacity = 1
description = "Spark rank 4 (rhea, serving + fallback build seed)"
ssh_host = "rhea"

[resources.definitions.moa]
capacity = 1
description = "Spark rank 5 (moa, serving + fallback build seed)"
ssh_host = "moa"

[resources.definitions.kakapo]
capacity = 3
description = "LAN-only GB10 build seed (3 counting build slots; --exclusive for umbrella)"
ssh_host = "kakapo"

[resources.definitions.cassowary]
capacity = 3
description = "LAN-only GB10 build seed (3 counting build slots; --exclusive for umbrella)"
ssh_host = "cassowary"

[resources.definitions.maxq]
capacity = 1
description = "maxq WSL2 SM120 host (quants, CPU gates, single-GPU correctness)"
ssh_host = "maxq"

[resources.definitions.build]
capacity = 5
description = "raptor concurrent CPU compile slots (niced -j16)"

[resources.definitions.cpu-gate]
capacity = 3
description = "raptor concurrent full CPU gate leases"

[resources.pools.lan_seeds]
members = ["kakapo", "cassowary"]
fallback = ["rhea", "moa"]

# ---------------------------------------------------------------------------
# Remote Build / Cluster Hosts (monitored by `peerswarm disk --remotes` & `gc`)
# ---------------------------------------------------------------------------

[[remote_hosts]]
host = "maxq"
role = "quant-and-cpu-gate"
watch_paths = ["~/Developer/cuteafd/peerswarm.state", "~/.cache/cuteafd/builds"]

[[remote_hosts]]
host = "kakapo"
role = "lan-build-seed"
watch_paths = ["~/Developer/cuteafd/peerswarm.state", "~/.cache/cuteafd/builds"]

[[remote_hosts]]
host = "cassowary"
role = "lan-build-seed"
watch_paths = ["~/Developer/cuteafd/peerswarm.state", "~/.cache/cuteafd/builds"]

[[remote_hosts]]
host = "ostrich"
role = "spark-rank-0"
watch_paths = ["~/.cache/cuteafd/builds"]

[[remote_hosts]]
host = "dodo"
role = "spark-rank-1"
watch_paths = ["~/.cache/cuteafd/builds"]

[[remote_hosts]]
host = "emu"
role = "spark-rank-2"
watch_paths = ["~/.cache/cuteafd/builds"]

[[remote_hosts]]
host = "kiwi"
role = "spark-rank-3"
watch_paths = ["~/.cache/cuteafd/builds"]

[[remote_hosts]]
host = "rhea"
role = "spark-rank-4"
watch_paths = ["~/.cache/cuteafd/builds"]

[[remote_hosts]]
host = "moa"
role = "spark-rank-5"
watch_paths = ["~/.cache/cuteafd/builds"]
