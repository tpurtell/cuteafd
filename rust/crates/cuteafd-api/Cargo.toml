[package]
name = "cuteafd-api"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
deepseek-recipe = "=0.1.0"
deepseek-recipe-encoding = "=0.1.0"
deepseek-recipe-core = "=0.1.0"
base64 = "=0.22.1"
percent-encoding = "=2.3.2"
ureq = "=2.12.1"
url = "=2.5.8"
jsonschema = { version = "=0.18.3", default-features = false, features = ["draft201909", "draft202012"] }
minijinja = { version = "=2.24.0", features = ["loop_controls", "preserve_order"] }
minijinja-contrib = { version = "=2.24.0", features = ["pycompat"] }
anyhow.workspace = true
async-stream.workspace = true
axum.workspace = true
futures.workspace = true
cuteafd-core = { path = "../cuteafd-core" }
cuteafd-loader = { path = "../cuteafd-loader" }
sha2.workspace = true
serde.workspace = true
serde_json.workspace = true
jiter = { version = "=0.17.0", default-features = false }
tokio.workspace = true
tracing.workspace = true
uuid.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json", "http2"] }
bytes.workspace = true
regex = "1"
http-body = "1"
hmac = "=0.12.1"
time = { version = "=0.3.55", features = ["formatting", "parsing"] }

[dev-dependencies]
tracing-subscriber.workspace = true
tokio-tungstenite = "0.24"
tempfile.workspace = true
tower.workspace = true
