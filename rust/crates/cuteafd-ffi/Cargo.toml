[package]
name = "cuteafd-ffi"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
test-support = []

[dependencies]
anyhow.workspace = true
libloading.workspace = true
libc.workspace = true
serde_json = { workspace = true, features = ["float_roundtrip"] }
serde.workspace = true
tracing.workspace = true
thiserror.workspace = true
# Process-wide expert geometry. `cuteafd-core` does not depend on `cuteafd-ffi`.
cuteafd-core = { path = "../cuteafd-core" }

[dev-dependencies]
cuteafd-ffi = { path = ".", features = ["test-support"] }
