[package]
name = "cuteafd-daemon"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "cuteafd"
path = "src/main.rs"

[features]
# Optional allocator instrumentation (2026-10-26): jemalloc as the global
# allocator so the coordinator's host heap can be measured with jemalloc's
# stats.  Off by default; the default build keeps glibc + malloc_tune.
jemalloc = ["dep:tikv-jemallocator", "dep:tikv-jemalloc-ctl"]

[dependencies]
anyhow.workspace = true
axum.workspace = true
bincode.workspace = true
bytes.workspace = true
clap.workspace = true
cuteafd-api = { path = "../cuteafd-api" }
cuteafd-bench = { path = "../cuteafd-bench" }
cuteafd-usage = { path = "../cuteafd-usage" }
cuteafd-core = { path = "../cuteafd-core" }
cuteafd-ffi = { path = "../cuteafd-ffi" }
cuteafd-hostcache = { path = "../cuteafd-hostcache" }
cuteafd-engine = { path = "../cuteafd-engine" }
cuteafd-loader = { path = "../cuteafd-loader" }
cuteafd-transport = { path = "../cuteafd-transport" }
io-uring.workspace = true
libc.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
url = "=2.5.8"
tikv-jemalloc-ctl = { version = "0.6.1", optional = true, features = ["stats", "use_std"] }
tikv-jemallocator = { version = "0.6.1", optional = true, features = ["stats"] }

[dev-dependencies]
cuteafd-ffi = { path = "../cuteafd-ffi", features = ["test-support"] }
tempfile.workspace = true
tower.workspace = true
