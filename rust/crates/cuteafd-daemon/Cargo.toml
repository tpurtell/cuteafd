cuteafd-api = { path = "../cuteafd-api" }
cuteafd-bench = { path = "../cuteafd-bench" }
cuteafd-usage = { path = "../cuteafd-usage" }
cuteafd-core = { path = "../cuteafd-core" }
cuteafd-ffi = { path = "../cuteafd-ffi" }
cuteafd-hostcache = { path = "../cuteafd-hostcache" }
cuteafd-engine = { path = "../cuteafd-engine" }
cuteafd-loader = { path = "../cuteafd-loader" }
cuteafd-transport = { path = "../cuteafd-transport" }
io-uring.workspace = true
libc.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
